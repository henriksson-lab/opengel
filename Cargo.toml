[package]
name = "opengel"
description = "Capture, simulate, detect and quantify gel electrophoresis images"
version = "0.1.0"
edition = "2021"
# The crate ships two binaries (`opengel` GUI, `gel` CLI); make bare `cargo run`
# launch the GUI. Use `cargo run --bin gel` for the CLI.
default-run = "opengel"
license = "MIT OR Apache-2.0"
authors = ["OpenGel contributors"]
repository = "https://github.com/henriksson-lab/opengel"
build = "build.rs"
# Publish only what builds the crate — src/ (incl. the .slint UI and bundled
# ladder JSON), build.rs, tests and the README. This keeps the multi-GB image
# datasets and other repo-only files (assets/, packaging/, Makefile) out.
include = ["/src", "/build.rs", "/tests", "/README.md"]

[lib]
name = "opengel"
path = "src/lib.rs"

[[bin]]
name = "gel"
path = "src/cli/main.rs"

[[bin]]
name = "opengel"
path = "src/gui/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = "0.25"
ndarray = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
imageproc = "0.25"
slint = "1.17"
rfd = "0.15"
printpdf = "0.7"
webbrowser = "1.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "rustls-tls", "smtp-transport"] }
burn = { version = "0.21", default-features = false, features = ["std", "flex", "wgpu"], optional = true }
burn-store = { version = "0.21", optional = true }
# Optional on Linux/other (needs libv4l-dev): enable with `--features camera`.
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }

# macOS (AVFoundation) and Windows (MediaFoundation) ship native capture with no
# extra system deps, so the real camera backend is always compiled there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }

[build-dependencies]
slint-build = "1.17"

# Optimize dependencies even in dev builds — heavy pixel work (image decode,
# nokhwa MJPEG decode, ndarray) is otherwise pathologically slow, which shows up
# as a laggy live preview. Our own crates stay unoptimized for fast debug builds.
[profile.dev.package."*"]
opt-level = 3

[features]
# The real USB camera backend is on by default on every platform. On macOS /
# Windows it is always compiled (native capture APIs, no extra system deps); on
# Linux this feature pulls in nokhwa, which needs libv4l-dev at build time and a
# libv4l-0 runtime dep. Build with `--no-default-features` to drop it on Linux
# (e.g. a headless/CI build without the v4l toolchain). See build.rs, which
# unifies both into the `camera_backend` cfg.
default = ["camera", "gelgenie-ml"]
camera = ["dep:nokhwa"]
gelgenie-ml = ["dep:burn", "dep:burn-store"]
