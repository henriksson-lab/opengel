[package]
name = "opengel"
description = "Capture, simulate, detect and quantify gel electrophoresis images"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["OpenGel contributors"]
repository = "https://github.com/opengel/opengel"
build = "build.rs"

[lib]
name = "opengel"
path = "src/lib.rs"

[[bin]]
name = "gel"
path = "src/cli/main.rs"

[[bin]]
name = "opengel"
path = "src/gui/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = "0.25"
ndarray = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
imageproc = "0.25"
slint = "1.17"
rfd = "0.15"
# Optional on Linux/other (needs libv4l-dev): enable with `--features camera`.
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }

# macOS (AVFoundation) and Windows (MediaFoundation) ship native capture with no
# extra system deps, so the real camera backend is always compiled there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }

[build-dependencies]
slint-build = "1.17"

# Optimize dependencies even in dev builds — heavy pixel work (image decode,
# nokhwa MJPEG decode, ndarray) is otherwise pathologically slow, which shows up
# as a laggy live preview. Our own crates stay unoptimized for fast debug builds.
[profile.dev.package."*"]
opt-level = 3

[features]
default = []
# Force-enable the real USB camera backend on platforms where it is opt-in
# (Linux/other). It is already on by default for macOS/Windows. See build.rs,
# which unifies both into the `camera_backend` cfg.
camera = ["dep:nokhwa"]
