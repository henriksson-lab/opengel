[package]
name = "opengel"
description = "Capture, simulate, detect and quantify gel electrophoresis images"
version = "0.1.0"
edition = "2021"
# The crate ships two binaries (`opengel` GUI, `gel` CLI); make bare `cargo run`
# launch the GUI. Use `cargo run --bin gel` for the CLI.
default-run = "opengel"
license = "MIT OR Apache-2.0"
authors = ["OpenGel contributors"]
repository = "https://github.com/henriksson-lab/opengel"
build = "build.rs"
# Publish only what builds the crate — src/ (incl. the .slint UI and bundled
# ladder JSON), build.rs, tests and the README. This keeps the multi-GB image
# datasets and other repo-only files (assets/, packaging/, Makefile) out.
include = ["/src", "/build.rs", "/tests", "/README.md"]

[lib]
name = "opengel"
path = "src/lib.rs"

[[bin]]
name = "gel"
path = "src/cli/main.rs"

[[bin]]
name = "opengel"
path = "src/gui/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
image = "0.25"
ndarray = "0.16"
rustfft = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
imageproc = "0.25"
slint = "1.17"
rfd = "0.15"
printpdf = "0.7"
webbrowser = "1.0"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "rustls-tls", "smtp-transport"] }
burn = { version = "0.21", default-features = false, features = ["std", "flex", "wgpu"], optional = true }
burn-store = { version = "0.21", optional = true }
# Optional on Linux/other (needs libv4l-dev): enable with `--features camera`.
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }
# nu-manager (https://github.com/henriksson-lab/numanager) is the device layer:
# scientific cameras (Toupcam/ToupTek and friends) are consumed as *devices* it
# discovers and drives, rather than through USB backends of our own. `os-usb`
# enables its live userspace USB transport.
numanager-core = { git = "https://github.com/henriksson-lab/numanager", optional = true }
numanager-drivers = { git = "https://github.com/henriksson-lab/numanager", optional = true, features = ["os-usb"] }

# macOS (AVFoundation) and Windows (MediaFoundation) ship native capture with no
# extra system deps, so the real camera backend is always compiled there.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
nokhwa = { version = "0.10", features = ["input-native"] }

[build-dependencies]
slint-build = "1.17"

# Optimize dependencies even in dev builds — heavy pixel work (image decode,
# nokhwa MJPEG decode, ndarray) is otherwise pathologically slow, which shows up
# as a laggy live preview. Our own crates stay unoptimized for fast debug builds.
[profile.dev.package."*"]
opt-level = 3

[features]
# Real camera capture is on by default on every platform, from two backends:
# nu-manager devices (scientific cameras) and nokhwa (plain webcams). Build with
# `--no-default-features` to drop both — e.g. a headless Linux/CI build, where
# nokhwa would otherwise need libv4l-dev at build time and libv4l-0 at runtime.
# On macOS / Windows nokhwa is always compiled (native capture APIs, no extra
# system deps). See build.rs, which unifies these into the `camera_backend` cfg.
default = ["camera", "gelgenie-ml"]
camera = ["nokhwa-camera", "numanager-camera"]
nokhwa-camera = ["dep:nokhwa"]
# Cameras as nu-manager devices. This is the path for scientific cameras
# (Toupcam/ToupTek, and everything else nu-manager grows a driver for).
numanager-camera = ["dep:numanager-core", "dep:numanager-drivers"]
gelgenie-ml = ["dep:burn", "dep:burn-store"]
