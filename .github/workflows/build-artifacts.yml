name: Build artifacts

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi

  checks:
    name: Tests and package checks
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Linux GUI build dependencies
        # libv4l-dev: the camera backend is a default feature, so the Linux build
        # (cargo test / cargo package) needs the v4l headers.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libv4l-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Package
        # Verify the crate packages and the tarball compiles, but WITHOUT the
        # default `gelgenie-ml` (burn/wgpu/cubecl) feature: re-linking that whole
        # ML stack in the verification build exhausts the runner's linker
        # (rust-lld bus-error/OOM). `cargo test` above already builds everything
        # with the ML stack, so buildability is covered; this checks the manifest
        # + include-list and that the core/GUI compile from the packaged files.
        run: cargo package --allow-dirty --no-default-features

  windows-exe:
    name: Windows executables
    needs: checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path dist/models
          Copy-Item target/release/opengel.exe "dist/OpenGel.exe"
          Copy-Item target/release/gel.exe "dist/gel.exe"
          Copy-Item assets/models/gelgenie_unet_1024.bpk "dist/models/gelgenie_unet_1024.bpk"
          Copy-Item assets/models/gelgenie_unet_1024.NOTICE.md "dist/models/gelgenie_unet_1024.NOTICE.md"
          Compress-Archive -Path "dist/OpenGel.exe","dist/gel.exe","dist/models" -DestinationPath opengel-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengel-windows-x64
          path: opengel-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux-deb:
    name: Debian package
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Linux build dependencies
        # libv4l-dev: the camera backend is a default feature, baked into the .deb.
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libv4l-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build .deb
        run: make deb

      - name: Derive Debian architecture
        id: deb_arch
        run: echo "arch=$(dpkg --print-architecture)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengel-linux-${{ steps.deb_arch.outputs.arch }}-deb
          path: target/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  macos-app:
    name: macOS app bundle (universal)
    needs: checks
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build app bundle
        run: make osx-app-universal

      - name: Verify universal binary
        run: lipo "target/osx/OpenGel.app/Contents/MacOS/opengel" -verify_arch x86_64 arm64

      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent "target/osx/OpenGel.app" opengel-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: opengel-macos-universal
          path: opengel-macos-universal.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, linux-deb, macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: opengel-*
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.deb
